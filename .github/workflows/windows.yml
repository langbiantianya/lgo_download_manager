name: windows

on:
  push:
    branches: [master]
    tags:    ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 上传 release 资产

jobs:
  package:
    name: package (${{ matrix.arch }})
    # x64 跑 windows-latest,arm64 跑 windows-11-arm(仅公开仓库可用);
    # 脚本走 cgo + LLVM-MinGW 交叉编译,但 winget / WiX / Inno Setup 都按
    # Windows 平台路径解析,跨 GOARCH 在 arm64 runner 上等价于「原生 GOARCH
    # + winget 拉同包」——两个 runner 都能稳定跑同一条脚本。
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            runs-on: windows-latest
            artifact_prefix: lgdm-windows-x64
            ext: x64
          - arch: arm64
            runs-on: windows-11-arm
            artifact_prefix: lgdm-windows-arm64
            ext: arm64
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 git describe 取版本号

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 脚本依赖(winget 一次性拉齐):
      #   - WiX Toolset CLI 6.0.2     (出 MSI)
      #   - Inno Setup 6              (出 EXE)
      #   - LLVM-MinGW UCRT           (x64 / arm64 cgo;同一个工具链包同时带
      #                                x86_64 与 aarch64 target)
      # 默认让脚本自动装;SkipToolInstall 不传,确保缺啥装啥。

      - name: package (MSI + EXE)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/package.ps1 `
            -Format both -Arch ${{ matrix.arch }}

      - name: list dist
        shell: pwsh
        run: Get-ChildItem dist/ | Format-Table Name, Length

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}
          path: |
            dist/lgdm-setup-*-${{ matrix.ext }}.msi
            dist/lgdm-setup-*-${{ matrix.ext }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lgdm-windows-x64/*.msi
            artifacts/lgdm-windows-x64/*.exe
            artifacts/lgdm-windows-arm64/*.msi
            artifacts/lgdm-windows-arm64/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
