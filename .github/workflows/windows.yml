name: windows

on:
  push:
    branches: [master]
    tags:    ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 上传 release 资产

# 两个独立 job,各自在原生架构 runner 上跑 scripts/package_native.ps1:
#   - x64:   windows-latest(原生 amd64)
#   - arm64: windows-11-arm(原生 arm64,仅公开仓库可用)
# 脚本要求 -Arch 与宿主 CPU 一致 —— runner 贴错标签会立刻报错,而不是安静地
# 出一个架构不符的包。不走交叉编译,因此没有 LLVM-MinGW target 选择。

jobs:
  windows-x64:
    name: windows x64
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 git describe 取版本号

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 打包依赖(脚本缺啥用 winget 装啥,不传 -SkipToolInstall):
      #   - WiX Toolset CLI 6.x  (MSI)
      #   - Inno Setup 6         (EXE)
      # C 编译器:windows runner 自带 mingw-w64 GCC,脚本按 gcc → clang →
      # LLVM-MinGW 的顺序解析宿主编译器。

      - name: package x64 (MSI + EXE)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/package_native.ps1 `
            -Arch x64 -Format both

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-windows-x64
          path: |
            dist/lgdm-setup-*-x64.msi
            dist/lgdm-setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30

  windows-arm64:
    name: windows arm64
    runs-on: windows-11-arm   # 仅公开仓库可用
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 与 x64 同一个脚本,只是 -Arch 不同:GOARCH=arm64 在 arm64 宿主上,
      # cgo 直接用宿主 C 编译器(缺 GCC 时脚本会装 LLVM-MinGW,其自带的
      # aarch64-w64-mingw32-clang 在同架构宿主上跑仍是原生编译)。

      - name: package arm64 (MSI + EXE)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/package_native.ps1 `
            -Arch arm64 -Format both

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-windows-arm64
          path: |
            dist/lgdm-setup-*-arm64.msi
            dist/lgdm-setup-*-arm64.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [windows-x64, windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lgdm-windows-x64/*.msi
            artifacts/lgdm-windows-x64/*.exe
            artifacts/lgdm-windows-arm64/*.msi
            artifacts/lgdm-windows-arm64/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
