name: linux

on:
  push:
    branches: [master]
    tags:    ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 上传 release 资产

# 拆成两个独立 job:
#   - x86_64: ubuntu-24.04(原生 amd64)——flatpak-builder 直接产 x86_64 flatpak
#   - aarch64: ubuntu-24.04-arm(原生 arm64,GitHub 2025 GA)——产 aarch64 flatpak
# 不再走 qemu-user-static + gcc-aarch64-linux-gnu 的交叉编译路径;每个 job
# 在原生架构上跑,SDK 的 qemu 模拟器 / binfmt_misc 都不需要。
# 见 scripts/build_flatpak.sh 的 can_run_arch(原生架构直接 return 0)。

jobs:
  flatpak-x86_64:
    name: flatpak x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 git describe 取版本号

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: install flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            pkg-config

      - name: register flathub
        # 脚本会用 `flatpak install --arch=x86_64 flathub` 装 gnome SDK 50。
        # Ubuntu 自带的 flathub 是过滤过的(只本机架构),改用未过滤的远程
        # (dl.flathub.org),保证 x86_64 与 aarch64 ref 都能拿到。
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: build flatpak x86_64
        run: |
          set -euo pipefail
          ./scripts/build_flatpak.sh --arch=x86_64

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-flatpak-x86_64
          path: dist/lgdm-*-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30

  flatpak-aarch64:
    name: flatpak aarch64
    runs-on: ubuntu-24.04-arm   # 原生 arm64 runner
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: install flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            pkg-config

      - name: register flathub
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: build flatpak aarch64
        run: |
          set -euo pipefail
          ./scripts/build_flatpak.sh --arch=aarch64

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-flatpak-aarch64
          path: dist/lgdm-*-aarch64.flatpak
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [flatpak-x86_64, flatpak-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lgdm-flatpak-x86_64/*.flatpak
            artifacts/lgdm-flatpak-aarch64/*.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
