name: linux

on:
  push:
    branches: [master]
    tags:    ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 上传 release 资产

# 两个独立 job,各自在原生架构 runner 上跑 scripts/build_flatpak_native.sh:
#   - x86_64:  ubuntu-24.04(原生 amd64)
#   - aarch64: ubuntu-24.04-arm(原生 arm64)
# 脚本要求 --arch 与宿主架构一致;不装 qemu-user-static,也不需要
# gcc-aarch64-linux-gnu 之类的交叉工具链 —— 原生构建用宿主 gcc。

jobs:
  portability:
    name: portability (cgo-free cross compile)
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 跨平台编译检查。internal/ui 依赖 Fyne 的 OpenGL 绑定(需要 cgo),
      # 无法在无 cgo 环境下交叉编译;但业务侧的这批包是纯 Go 的,可以为
      # linux / darwin / windows × amd64 / arm64 全部编译一遍。
      #
      # 之前 internal/ui/disk_unix.go 里 Statfs_t.Bsize 的类型在 darwin 上
      # 是 uint32,在 linux 上是 int64,macOS 构建直接编译失败——CI 没有
      # macOS 作业,这个洞就漏了过去。这个 job 就是来堵这类洞的。
      - name: cross-compile the cgo-free packages
        run: |
          set -euo pipefail
          packages="
            ./internal/api/
            ./internal/appservice/
            ./internal/autostart/
            ./internal/bittorrent/
            ./internal/diskstat/
            ./internal/engine/
            ./internal/logging/
            ./internal/protocol/
            ./internal/rpc/
            ./internal/rpc/addr/
            ./internal/rpc/grpcx/
            ./internal/rpc/httpx/
            ./internal/scheduler/
            ./internal/settings/
            ./internal/store/
            ./internal/uimgr/
            ./internal/urlkind/
            ./internal/urllauncher/
          "
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "::group::build $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build $packages
              echo "::endgroup::"
            done
          done

  test:
    name: unit + contract tests
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # `go test ./...` 会编到 internal/ui，它是 cgo 包（Fyne 的 OpenGL 绑定），
      # 需要系统里有 GL/X11 头文件与图形库。按 Fyne 官方文档给的命令装：
      # https://docs.fyne.io/started/ 里 Linux(Debian/Ubuntu) 那一条就是
      # `gcc libgl1-mesa-dev xorg-dev`。
      #
      # 另加 libwayland-dev + libxkbcommon-dev：go-gl/glfw 在 Linux 上默认
      # **同时**编 X11 与 Wayland 两套 C 源码（构建标签既不给 x11 也不给
      # wayland 时两条都成立），Wayland 那半边要 <wayland-client-core.h>
      # 与 <xkbcommon/xkbcommon.h>，xorg-dev 不含它们。
      #
      # g++ 是为 anacrolix/go-libutp 装的：internal/ui 的测试会连到 bittorrent，
      # 那条链上有 C++ 源码。runner 镜像本来就有 g++，这里显式写上，
      # 不依赖镜像自带什么。
      #
      # internal/ui 的测试本身不需要显示：它们用 fyne.io/fyne/v2/test 的
      # 无头软件渲染器，实测清掉 DISPLAY/WAYLAND_DISPLAY 连跑三次全绿。
      - name: install Fyne build dependencies (cgo)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev

      # 全量测试。这个 job 之前不存在——本分支加了契约测试、边界测试、
      # OpenAPI 一致性测试等一大把护栏，但三个 workflow 里一个 go test
      # 都没有，护栏在流水线里等于不存在：下一个提交就能悄悄打破分层
      # 约束、改歪 api.Spec 的字段映射、把 OpenAPI 与 DTO 改歪，CI 照样
      # 全绿。
      #
      # internal/ui 的测试不需要显示：它们用 fyne.io/fyne/v2/test 的
      # 无头软件渲染器，实测清掉 DISPLAY/WAYLAND_DISPLAY 连跑三次全绿。
      - name: go test
        run: go test ./...

      # race 只对本分支新增/改造的包强制。
      #
      # internal/ui 不进 race 门禁：那里的 -race 在本机 flaky，栈 100% 落在
      # fyne.io/fyne/v2 → github.com/go-text/typesetting/harfbuzz.(*Buffer).Clear
      # （Fyne 的文本整形库），基线上同样如此，不是本分支引入的。普通
      # go test ./... 已经覆盖了 internal/ui。
      - name: go test -race (contract + boundary packages)
        run: |
          set -euo pipefail
          go test -race -count=3 \
            ./internal/rpc/... \
            ./internal/appservice/ \
            ./internal/uimgr/... \
            ./internal/api/ \
            ./internal/urlkind/

  proto-sync:
    name: protobuf generated code is up to date
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 工具链**钉版本**，不用 @latest。
      #
      # 生成物入库（internal/rpc/grpcx/pb），所以工具链版本一变，生成物就
      # 会跟着变——用 @latest 的话，这个 job 会自己变成 flaky 源：上游发个
      # 新版本，重新生成就有差异，CI 红了，但代码一行没改。
      #
      # 钉的版本要与 go.mod 里的 google.golang.org/protobuf 对齐
      # （v1.36.12），否则生成物与运行时库的版本可能不匹配。
      - name: install protobuf toolchain
        run: |
          set -euo pipefail
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      # 重新生成并比对：proto/lgdm/v1/lgdm.proto 是 gRPC 契约的唯一权威源，
      # 生成物必须与它保持同步。改了 proto 却忘了重新生成（或手工改了
      # 生成物），这里会红。
      - name: regenerate and diff
        run: |
          set -euo pipefail
          PATH="$(go env GOPATH)/bin:$PATH" ./scripts/gen_proto.sh
          if ! git diff --exit-code --stat internal/rpc/grpcx/pb; then
            echo "::error::生成物与 proto/lgdm/v1/lgdm.proto 不同步，请运行 scripts/gen_proto.sh 后提交生成物"
            exit 1
          fi

  flatpak-x86_64:
    name: flatpak x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 git describe 取版本号

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 只装原生构建需要的东西:flatpak / flatpak-builder / 宿主 gcc。
      # (脚本会把 flatpak SDK 当 sysroot,GL/X11/wayland 的头与库都在里面,
      # 不需要额外的 -devel 包。)
      - name: install flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            build-essential \
            pkg-config

      - name: install runtime and SDK
        # 用 sudo(系统安装):脚本里的 flatpak info / flatpak-builder 都不带
        # --user,默认按系统安装解析,装到 --user 里它们会找不到。
        # 不加 sudo 时普通用户没有 ConfigureRemote 权限,直接报
        #   error: Flatpak system operation ConfigureRemote not allowed for user
        run: |
          set -euo pipefail
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08

      - name: build flatpak x86_64
        run: |
          set -euo pipefail
          ./scripts/build_flatpak_native.sh --arch=x86_64

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-flatpak-x86_64
          path: dist/lgdm-*-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30

  flatpak-aarch64:
    name: flatpak aarch64
    runs-on: ubuntu-24.04-arm   # 原生 arm64 runner
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: install flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            build-essential \
            pkg-config

      - name: install runtime and SDK
        # 与 x86_64 job 同理:sudo 装到系统安装,脚本内部的 flatpak info /
        # flatpak-builder 默认也按系统安装解析。
        run: |
          set -euo pipefail
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08

      - name: build flatpak aarch64
        run: |
          set -euo pipefail
          ./scripts/build_flatpak_native.sh --arch=aarch64

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-flatpak-aarch64
          path: dist/lgdm-*-aarch64.flatpak
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [flatpak-x86_64, flatpak-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lgdm-flatpak-x86_64/*.flatpak
            artifacts/lgdm-flatpak-aarch64/*.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
