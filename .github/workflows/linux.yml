name: linux

on:
  push:
    branches: [master]
    tags:    ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 上传 release 资产

# 两个独立 job,各自在原生架构 runner 上跑 scripts/build_flatpak_native.sh:
#   - x86_64:  ubuntu-24.04(原生 amd64)
#   - aarch64: ubuntu-24.04-arm(原生 arm64)
# 脚本要求 --arch 与宿主架构一致;不装 qemu-user-static,也不需要
# gcc-aarch64-linux-gnu 之类的交叉工具链 —— 原生构建用宿主 gcc。

jobs:
  portability:
    name: portability (cgo-free cross compile)
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 跨平台编译检查。internal/ui 依赖 Fyne 的 OpenGL 绑定(需要 cgo),
      # 无法在无 cgo 环境下交叉编译;但业务侧的这批包是纯 Go 的,可以为
      # linux / darwin / windows × amd64 / arm64 全部编译一遍。
      #
      # 之前 internal/ui/disk_unix.go 里 Statfs_t.Bsize 的类型在 darwin 上
      # 是 uint32,在 linux 上是 int64,macOS 构建直接编译失败——CI 没有
      # macOS 作业,这个洞就漏了过去。这个 job 就是来堵这类洞的。
      - name: cross-compile the cgo-free packages
        run: |
          set -euo pipefail
          packages="
            ./internal/autostart/
            ./internal/bittorrent/
            ./internal/diskstat/
            ./internal/engine/
            ./internal/ipc/
            ./internal/logging/
            ./internal/protocol/
            ./internal/scheduler/
            ./internal/settings/
            ./internal/store/
            ./internal/uimgr/
            ./internal/urllauncher/
          "
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "::group::build $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build $packages
              echo "::endgroup::"
            done
          done

  flatpak-x86_64:
    name: flatpak x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 git describe 取版本号

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      # 只装原生构建需要的东西:flatpak / flatpak-builder / 宿主 gcc。
      # (脚本会把 flatpak SDK 当 sysroot,GL/X11/wayland 的头与库都在里面,
      # 不需要额外的 -devel 包。)
      - name: install flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            build-essential \
            pkg-config

      - name: install runtime and SDK
        # 用 sudo(系统安装):脚本里的 flatpak info / flatpak-builder 都不带
        # --user,默认按系统安装解析,装到 --user 里它们会找不到。
        # 不加 sudo 时普通用户没有 ConfigureRemote 权限,直接报
        #   error: Flatpak system operation ConfigureRemote not allowed for user
        run: |
          set -euo pipefail
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08

      - name: build flatpak x86_64
        run: |
          set -euo pipefail
          ./scripts/build_flatpak_native.sh --arch=x86_64

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-flatpak-x86_64
          path: dist/lgdm-*-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30

  flatpak-aarch64:
    name: flatpak aarch64
    runs-on: ubuntu-24.04-arm   # 原生 arm64 runner
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: install flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            build-essential \
            pkg-config

      - name: install runtime and SDK
        # 与 x86_64 job 同理:sudo 装到系统安装,脚本内部的 flatpak info /
        # flatpak-builder 默认也按系统安装解析。
        run: |
          set -euo pipefail
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08

      - name: build flatpak aarch64
        run: |
          set -euo pipefail
          ./scripts/build_flatpak_native.sh --arch=aarch64

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-flatpak-aarch64
          path: dist/lgdm-*-aarch64.flatpak
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [flatpak-x86_64, flatpak-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lgdm-flatpak-x86_64/*.flatpak
            artifacts/lgdm-flatpak-aarch64/*.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
