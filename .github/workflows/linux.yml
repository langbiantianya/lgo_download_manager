name: linux

on:
  push:
    branches: [master]
    tags:    ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 上传 release 资产

jobs:
  flatpak:
    name: flatpak (${{ matrix.arch }})
    # 一次 runner 同时出 x86_64 与 aarch64:脚本走 cgo + GCC 交叉编译 + qemu
    # 在沙箱里执行 aarch64 的 install/appstream 等步骤,不需要 arm64 runner。
    # 见 scripts/build_flatpak.sh 的 can_run_arch / prepare_toolchain。
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 git describe 取版本号

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: install flatpak toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            qemu-user-static \
            gcc-aarch64-linux-gnu \
            pkg-config

      - name: register flathub
        # 脚本会用 `flatpak install --arch=<arch> flathub` 装 gnome SDK。
        # Ubuntu 自带的 flathub 是过滤过的(只本机架构),aarch64 拉不到;
        # 改用未过滤的 flathub 远程(dl.flathub.org)。
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: build flatpak
        run: |
          set -euo pipefail
          ./scripts/build_flatpak.sh --arch=${{ matrix.arch }}

      - name: list dist
        run: ls -lh dist/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgdm-flatpak-${{ matrix.arch }}
          path: dist/lgdm-*-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lgdm-flatpak-x86_64/*.flatpak
            artifacts/lgdm-flatpak-aarch64/*.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
